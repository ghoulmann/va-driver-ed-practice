<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engine tests</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f5f4b'/%3E%3Cpath d='M8 17l5 5 11-12' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header class="chrome"><h1>Engine tests <span>fsrs · select · session · store</span></h1></header>
  <main><section class="card"><ul id="out" class="bars"></ul><p id="tally"></p></section></main>
  <script type="module">
    import { suite } from './engine.test.js';
    const bank = await fetch('../data/items.json').then((r) => r.json());
    const results = suite({ bank });
    document.getElementById('out').innerHTML = results.map((r) => `
      <li style="color:${r.ok ? 'var(--good)' : 'var(--bad)'}">
        ${r.ok ? '✓' : '✗'} ${r.name}
        ${r.ok ? '' : `<div class="small">${r.message}</div>`}
      </li>`).join('');
    const failed = results.filter((r) => !r.ok).length;
    document.getElementById('tally').textContent =
      `${results.length - failed}/${results.length} passed`;
  </script>
</body>
</html>
